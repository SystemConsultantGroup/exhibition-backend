server:
  tomcat:
    max-part-count: 100
spring:
  application:
    name: exhibition
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:1000MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:10GB}
  profiles:
    active: prod
    group:
      prod: common
      dev: dev
